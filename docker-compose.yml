services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: mediquery-v2:latest
    container_name: mediquery-api
    env_file:
      - .env
    environment:
      QDRANT_URL: http://host.docker.internal:6335
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: mediquery-v2:latest
    container_name: mediquery-frontend
    command:
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
